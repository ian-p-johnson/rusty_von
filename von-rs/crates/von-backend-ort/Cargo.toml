[package]
name = "von-backend-ort"
description = "ONNX Runtime backend for the von Option-Marker engine (Stage 2, Route A)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
von-core = { workspace = true }
von-types = { workspace = true }
ort = { workspace = true }
tokenizers = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
sha2 = "0.10"

[features]
default = ["load-dynamic"]
# CPU + CUDA both run through an onnxruntime shared library given by
# ORT_DYLIB_PATH instead of ort-sys's downloaded prebuilt binaries:
#
# 1. Numerics: the Rust port must match the same ORT build the parity
#    instruments use (the official wheel). The pyke-downloaded 1.2x build
#    diverges up to ~3e-4 from the torch oracle on this graph, while the
#    1.30 wheel dylib stays under ~5e-5.
# 2. Blackwell (sm_120): the downloaded CUDA kernels lack sm_120 SASS/PTX
#    and abort with cudaErrorNoKernelImageForDevice; the official
#    onnxruntime-gpu wheel works (verified on an RTX 5070 Ti via laya).
#    Install it with: .venv/bin/pip install onnxruntime-gpu
load-dynamic = ["ort/load-dynamic"]
cuda = ["ort/cuda", "load-dynamic"]
